name: PumpkinIventPlugin
main: ru.craft.classic.PumpkinEventPlugin
version: 2.0.0
api-version: '1.21'
author: Kalimulin.D.A
commands:
  pumpkin:
    description: Halloween event shop and Pumpkin King commands
    aliases: [pumpkinevent, pe]
    usage: /<command> [shop|boss|reload]
permissions:
  pumpkin.reload:
    default: op
    description: Reload PumpkinEventPlugin configuration
  pumpkin.admin:
    default: op
    description: Start/stop the Pumpkin King and set its arena spawn
